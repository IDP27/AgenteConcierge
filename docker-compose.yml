services:
  postgres:
    image: postgres:16-alpine
    container_name: concierge-postgres
    environment:
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: concierge
      POSTGRES_DB: concierge
    ports:
      # 5433 no host para não colidir com outros Postgres locais
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concierge -d concierge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
